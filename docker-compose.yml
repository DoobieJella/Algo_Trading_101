version: '3.8'

services:
  trading_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot
    volumes:
      - ./src:/app/src
      - ./tests:/app/test
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: [ "bash", "-lc", "sleep infinity" ]
    stdin_open: true # keeps STDIN open (nice for shells)
    tty: true # allocates a TTY (nice for interactive use)
